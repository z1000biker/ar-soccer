<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Soccer</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      z-index: 1000;
    }
    #overlay.hidden {
      display: none;
    }
    h1 {
      font-size: 48px;
      margin: 20px;
    }
    input {
      padding: 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      margin: 10px;
      min-width: 250px;
      text-align: center;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      margin: 10px;
      cursor: pointer;
      min-width: 250px;
    }
    .btn-host {
      background: #10b981;
      color: white;
    }
    .btn-join {
      background: #3b82f6;
      color: white;
    }
    .btn-start {
      background: #f59e0b;
      color: white;
      font-size: 24px;
    }
    .btn-back {
      background: rgba(255,255,255,0.2);
      color: white;
    }
    #lobby {
      text-align: center;
    }
    #roomCode {
      font-size: 48px;
      letter-spacing: 10px;
      font-weight: bold;
      margin: 20px;
    }
    #arOverlay {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      z-index: 100;
      display: none;
    }
    #arOverlay.visible {
      display: block;
    }
    .ar-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-exit {
      background: #ef4444;
      padding: 8px 16px;
      font-size: 14px;
      min-width: auto;
    }
    #instructions {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      z-index: 100;
      display: none;
    }
    #instructions.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="setup">
      <h1>⚽ AR Soccer</h1>
      <input type="text" id="playerName" placeholder="Your Name" value="Player">
      <br>
      <button class="btn-host" onclick="hostGame()">📡 Host Game</button>
      <br>
      <p>OR</p>
      <input type="text" id="roomInput" placeholder="Room Code">
      <button class="btn-join" onclick="joinGame()">👥 Join Game</button>
    </div>
    <div id="lobby" style="display:none">
      <h1>⚽ AR Soccer</h1>
      <p>Room Code:</p>
      <div id="roomCode"></div>
      <p id="players"></p>
      <button class="btn-start" onclick="startAR()">▶️ Start AR</button>
      <br>
      <button class="btn-back" onclick="backToSetup()">Back</button>
    </div>
  </div>

  <div id="arOverlay">
    <div class="ar-info">
      <div>
        <div>Room: <span id="arRoom"></span></div>
        <div id="arPlayers"></div>
      </div>
      <button class="btn-exit" onclick="exitAR()">Exit</button>
    </div>
  </div>

  <div id="instructions">Tap to place ball • Tap again to kick</div>

  <div id="debugLog" style="position: fixed; bottom: 0; left: 0; right: 0; background: black; color: lime; padding: 10px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; z-index: 9999;"></div>

  <canvas id="glCanvas"></canvas>

  <script>
    // Debug logger
    function log(msg) {
      const d = document.getElementById('debugLog');
      d.innerHTML += msg + '<br>';
      d.scrollTop = d.scrollHeight;
      console.log(msg);
    }
    window.onerror = function(msg, url, line) {
      log('ERROR: ' + msg + ' at line ' + line);
    };
  </script>
  <script>
    let state = {
      playerName: '',
      roomCode: '',
      players: [],
      xrSession: null,
      gl: null,
      xrRefSpace: null
    };

    function hostGame() {
      state.playerName = document.getElementById('playerName').value || 'Player';
      state.roomCode = Math.random().toString(36).substr(2, 6).toUpperCase();
      state.players = [state.playerName];
      showLobby();
    }

    function joinGame() {
      state.playerName = document.getElementById('playerName').value || 'Player';
      state.roomCode = document.getElementById('roomInput').value.toUpperCase();
      if (!state.roomCode) {
        alert('Enter room code');
        return;
      }
      state.players = [state.playerName];
      showLobby();
    }

    function showLobby() {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('lobby').style.display = 'block';
      document.getElementById('roomCode').textContent = state.roomCode;
      document.getElementById('players').textContent = 'Players: ' + state.players.join(', ');
    }

    function backToSetup() {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('setup').style.display = 'block';
    }

    async function startAR() {
      log('startAR called');
      
      if (!navigator.xr) {
        log('ERROR: navigator.xr not found');
        alert('WebXR not supported');
        return;
      }
      log('navigator.xr exists');

      try {
        log('Checking AR support...');
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        log('AR supported: ' + supported);
        
        if (!supported) {
          alert('AR not supported. Use Chrome on Android with ARCore.');
          return;
        }

        log('Requesting AR session...');
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        });
        log('AR session created!');

        state.xrSession = session;
        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('arOverlay').classList.add('visible');
        document.getElementById('instructions').classList.add('visible');
        document.getElementById('arRoom').textContent = state.roomCode;
        document.getElementById('arPlayers').textContent = 'Players: ' + state.players.join(', ');

        session.addEventListener('end', onSessionEnd);
        log('Starting session...');
        await onSessionStarted(session);
        log('Session started successfully!');
      } catch (e) {
        log('AR EXCEPTION: ' + e.message);
        alert('AR Error: ' + e.message);
        console.error(e);
      }
    }

    function exitAR() {
      if (state.xrSession) {
        state.xrSession.end();
      }
    }

    function onSessionEnd() {
      state.xrSession = null;
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('arOverlay').classList.remove('visible');
      document.getElementById('instructions').classList.remove('visible');
      document.getElementById('lobby').style.display = 'block';
    }

    async function onSessionStarted(session) {
      log('onSessionStarted called');
      const canvas = document.getElementById('glCanvas');
      log('Canvas found');
      
      const gl = canvas.getContext('webgl', { xrCompatible: true });
      if (!gl) {
        log('ERROR: WebGL context failed');
        alert('WebGL not supported');
        return;
      }
      log('WebGL context created');
      
      state.gl = gl;

      log('Making XR compatible...');
      await gl.makeXRCompatible();
      log('XR compatible done');

      log('Creating XRWebGLLayer...');
      const glLayer = new XRWebGLLayer(session, gl);
      log('XRWebGLLayer created');
      
      await session.updateRenderState({ baseLayer: glLayer });
      log('Render state updated');

      log('Requesting reference space...');
      const refSpace = await session.requestReferenceSpace('local-floor');
      log('Reference space created');
      state.xrRefSpace = refSpace;

      log('Requesting hit test source...');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
      log('Hit test source created');

      log('Starting render loop...');

      // Setup scene
      const ballState = {
        position: null,
        velocity: [0, 0, 0],
        placed: false,
        groundY: 0
      };

      const reticlePos = { x: 0, y: 0, z: 0, visible: false };

      session.addEventListener('select', () => {
        log('SELECT event fired');
        if (!ballState.placed && reticlePos.visible) {
          ballState.position = [reticlePos.x, reticlePos.y + 0.11, reticlePos.z];
          ballState.groundY = reticlePos.y;
          ballState.placed = true;
          reticlePos.visible = false;
          log('Ball placed at: ' + JSON.stringify(ballState.position));
        } else if (ballState.placed) {
          ballState.velocity = [0, 0.3, -0.5];
          log('Ball kicked!');
        }
      });

      // Render loop
      let frameCount = 0;
      session.requestAnimationFrame(function onFrame(time, frame) {
        session.requestAnimationFrame(onFrame);
        
        if (frameCount === 0) {
          log('First frame rendered!');
        }
        frameCount++;

        const pose = frame.getViewerPose(refSpace);
        if (!pose) return;

        gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        // Hit test
        if (!ballState.placed) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hitPose = hitTestResults[0].getPose(refSpace);
            reticlePos.x = hitPose.transform.position.x;
            reticlePos.y = hitPose.transform.position.y;
            reticlePos.z = hitPose.transform.position.z;
            reticlePos.visible = true;
          }
        }

        // Update ball physics
        if (ballState.placed) {
          const dt = 0.016;
          ballState.velocity[1] -= 9.8 * dt;
          
          ballState.position[0] += ballState.velocity[0] * dt;
          ballState.position[1] += ballState.velocity[1] * dt;
          ballState.position[2] += ballState.velocity[2] * dt;

          if (ballState.position[1] < ballState.groundY + 0.11) {
            ballState.position[1] = ballState.groundY + 0.11;
            ballState.velocity[1] = Math.abs(ballState.velocity[1]) * 0.7;
            ballState.velocity[0] *= 0.95;
            ballState.velocity[2] *= 0.95;
          }

          ballState.velocity[0] *= 0.98;
          ballState.velocity[2] *= 0.98;
        }

        for (const view of pose.views) {
          const viewport = glLayer.getViewport(view);
          gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
        }
      });
      
      log('Render loop setup complete!');
    }

    function drawCircle(gl, view, pos, radius, color) {
      // Simplified - just showing it's drawing
      // In real implementation, use proper WebGL shaders
    }

    function drawSphere(gl, view, pos, radius, color) {
      // Simplified - just showing it's drawing  
      // In real implementation, use proper WebGL shaders
    }
  </script>
</body>
</html>
